name: Build Shanaya APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Source Code
      run: |
        mkdir -p app_source
        unzip -q -o *.zip -d app_source

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK (Smart Fallback)
      run: |
        cd app_source
        # प्रोजेक्ट के मेन फोल्डर को ढूँढना
        PROJECT_DIR=$(dirname $(find . -name "settings.gradle*" | head -n 1))
        cd "$PROJECT_DIR"
        
        # मिसिंग फाइल की जगह डायरेक्ट सिस्टम Gradle का इस्तेमाल करना
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Shanaya-App-APK
        path: "**/*.apk"

